<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A free, local-first studio for project requirements and website briefs. Ten guided sections, a live readiness score, and autosave — with no account, no server and no tracking."
    />
    <title>ReqStudio — Requirements. Planned. Perfected.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('reqstudio.settings')
          var state = raw ? JSON.parse(raw).state : null
          // Light is the default; dark only when explicitly chosen.
          document.documentElement.classList.toggle('dark', !!state && state.theme === 'dark')
          if (state && state.fontSize) {
            document.documentElement.dataset.fontSize = state.fontSize
          }
        } catch (e) {
          /* first run — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
