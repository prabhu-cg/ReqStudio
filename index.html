<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ReqStudio — a free, local-first studio for building professional project requirements and website briefs."
    />
    <title>ReqStudio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C74504'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M10 7h8l5 5v13H10z'/%3E%3Cpath d='M18 7v5h5'/%3E%3Cpath d='m12.5 18 2 2 4-4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('reqstudio.settings')
          var state = raw ? JSON.parse(raw).state : null
          var theme = (state && state.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          if (state && state.fontSize) {
            document.documentElement.dataset.fontSize = state.fontSize
          }
        } catch (e) {
          /* first run — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
